services:
  - type: web
    name: metaphor-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_INTEGRATION_TOKEN
        sync: false
      - key: API_PREFIX
        value: "/api/v1"
      - key: PYTHON_VERSION
        value: "3.10.12"
